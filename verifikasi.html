<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruang Verifikasi RBD | Pertamina</title>
    <meta name="description" content="Tinjau dan susun reliability block diagram kilang bersama" />
    <style>
      :root { color-scheme: light; --biru: #1d4ed8; --teks: #0f172a; --teks-2: #475569; --garis: #e2e8f0; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f1f5f9; color: var(--teks); font-family: system-ui, 'Segoe UI', Roboto, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
      main { width: 100%; max-width: 460px; background: #fff; border: 1px solid var(--garis); border-radius: 14px; padding: 32px 28px; text-align: center; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); }
      .logo { width: 44px; height: 44px; margin: 0 auto 14px; display: block; }
      h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
      .sub { margin: 0 0 22px; font-size: 13px; color: var(--teks-2); }
      .status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: #e0e7ff; color: #1e40af; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: kedip 1.2s infinite; }
      @keyframes kedip { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      p.pesan { margin: 0 0 20px; font-size: 14px; line-height: 1.55; color: var(--teks-2); }
      button { padding: 10px 22px; border-radius: 999px; border: 0; background: var(--biru); color: #fff; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
      button[hidden] { display: none; }
      .kecil { margin: 18px 0 0; font-size: 12px; color: #64748b; }
      .galat { background: #fee2e2; color: #b91c1c; }
      .galat .dot { animation: none; }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#102a43" />
        <rect x="5" y="13" width="7" height="6" rx="1" fill="#fff" />
        <rect x="20" y="7" width="7" height="6" rx="1" fill="#4ade80" />
        <rect x="20" y="19" width="7" height="6" rx="1" fill="#4ade80" />
        <path d="M12 16h4M16 10v12M16 10h4M16 22h4" stroke="#fff" stroke-width="1.6" fill="none" />
      </svg>
      <h1>Ruang Verifikasi RBD</h1>
      <p class="sub">Tinjau dan susun reliability block diagram kilang bersama</p>
      <div id="status" class="status" role="status"><span class="dot"></span><span id="status-teks">Membuka Ruang Verifikasi</span></div>
      <p id="pesan" class="pesan">Sedang mencari server.</p>
      <button id="tombol" hidden>Coba lagi</button>
      <p class="kecil">Alamat server dapat berubah, tetapi halaman ini tetap. Simpan halaman ini sebagai bookmark.</p>
    </main>
    <script>
      // Alamat server dibaca dari verifikasi.json, yang diperbarui otomatis
      // oleh laptop server setiap kali alamatnya berganti. Halaman ini hanya
      // meneruskan ke alamat yang benar-benar menjawab.
      const SUMBER = ['verifikasi.json', 'https://raw.githubusercontent.com/fash-droid/cdu-link/main/verifikasi.json']
      const JEDA_MS = 5000
      const BATAS_COBA = 36
      const STATUS = document.getElementById('status')
      const TEKS = document.getElementById('status-teks')
      const PESAN = document.getElementById('pesan')
      const TOMBOL = document.getElementById('tombol')

      function batasWaktu(ms) {
        if (window.AbortSignal && AbortSignal.timeout) return AbortSignal.timeout(ms)
        const c = new AbortController()
        setTimeout(() => c.abort(), ms)
        return c.signal
      }
      async function daftarAlamat() {
        const keluar = []
        for (const s of SUMBER) {
          try {
            const r = await fetch(s + '?ts=' + Date.now(), { cache: 'no-store', signal: batasWaktu(6000) })
            if (!r.ok) continue
            const d = await r.json()
            if (d && /^https:\/\//.test(d.url || '') && !keluar.includes(d.url)) keluar.push(d.url)
          } catch (e) { console.warn('gagal membaca', s, e) }
        }
        return keluar
      }
      async function menjawab(url) {
        try {
          const r = await fetch(url + '/api/sehat', { cache: 'no-store', signal: batasWaktu(8000) })
          return r.ok
        } catch (e) { return false }
      }
      function tampilkanGalat() {
        STATUS.classList.add('galat')
        TEKS.textContent = 'Server belum dapat dihubungi'
        PESAN.textContent = 'Laptop server mungkin mati, tertidur, atau sedang tidak tersambung ke internet. Minta pengelola membuka Kontrol Web, lalu coba lagi.'
        TOMBOL.hidden = false
      }
      async function mulai() {
        STATUS.classList.remove('galat')
        TOMBOL.hidden = true
        for (let i = 0; i < BATAS_COBA; i++) {
          TEKS.textContent = i ? 'Menunggu server menyambung' : 'Membuka Ruang Verifikasi'
          PESAN.textContent = i ? 'Server sedang menyambung ulang. Halaman ini mencoba lagi otomatis.' : 'Sedang mencari server.'
          const alamat = await daftarAlamat()
          for (const url of alamat) {
            if (await menjawab(url)) {
              TEKS.textContent = 'Server ditemukan'
              PESAN.textContent = 'Membuka Ruang Verifikasi RBD.'
              location.replace(url + '/')
              return
            }
          }
          await new Promise((ok) => setTimeout(ok, JEDA_MS))
        }
        tampilkanGalat()
      }
      TOMBOL.addEventListener('click', mulai)
      mulai()
    </script>
  </body>
</html>
