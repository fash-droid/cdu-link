<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keandalan CDU | Pertamina RU VI Balongan</title>
    <meta
      name="description"
      content="Analisis keandalan dan optimasi pemeliharaan Crude Distillation Unit RU VI Pertamina Balongan"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --biru: #0b2f9f;
        --merah: #e21f23;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 480px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 32px 28px;
        text-align: center;
      }
      .logo {
        width: 42px;
        height: 42px;
        margin: 0 auto 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 700;
      }
      .sub {
        margin: 0 0 22px;
        font-size: 13px;
        color: #64748b;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #eef2fd;
        color: var(--biru);
        font-size: 12.5px;
        font-weight: 600;
        margin-bottom: 18px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--biru);
        animation: kedip 1.2s infinite;
      }
      @keyframes kedip {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      p.pesan {
        margin: 0 0 20px;
        font-size: 13.5px;
        line-height: 1.55;
        color: #475569;
      }
      button {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid var(--biru);
        background: var(--biru);
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #0a2680;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      .kecil {
        margin-top: 16px;
        font-size: 11px;
        color: #94a3b8;
      }
      a.kecil {
        color: inherit;
        text-decoration: underline;
      }
      .error {
        background: #fdeef0;
        color: #9d1418;
      }
      .error .dot {
        background: #9d1418;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M4 17.5 12.4 4l3.1 5.1-8.4 13.4H4z" fill="#0b2f9f" />
        <path d="M10.6 22.5 19 9l3.1 5.1-8.4 8.4h-3.1z" fill="#1f9d68" />
        <path d="M17.8 22.5 22.6 17l1.4 2.3-3.1 3.2h-3.1z" fill="#e21f23" />
      </svg>
      <h1>Keandalan CDU</h1>
      <p class="sub">Pertamina RU VI Balongan · Unit 11</p>

      <div id="status" class="status">
        <span class="dot"></span>
        <span id="status-teks">Membuka aplikasi</span>
      </div>

      <p id="pesan" class="pesan">
        Sedang meneruskan Anda ke aplikasi. Kalau tidak berpindah dalam beberapa detik, tekan
        tombol di bawah.
      </p>

      <button id="tombol" disabled>Buka aplikasi</button>

      <p class="kecil">
        Alamat aplikasi bisa berubah dari waktu ke waktu, tetapi halaman ini tetap.
        Simpan halaman ini sebagai bookmark.
      </p>
    </main>

    <script>
      // ================================================================
      // Ambil URL aktif dari url.json (di repo yang sama), lalu redirect.
      // Kalau url.json belum berisi (backend baru diaktifkan pertama kali),
      // atau tunnel sedang mati, tampilkan pesan dan tombol coba lagi.
      // ================================================================
      const STATUS = document.getElementById('status')
      const TEKS = document.getElementById('status-teks')
      const PESAN = document.getElementById('pesan')
      const TOMBOL = document.getElementById('tombol')

      function tampilkanGalat(msg) {
        STATUS.classList.add('error')
        TEKS.textContent = 'Aplikasi belum aktif'
        PESAN.textContent = msg
        TOMBOL.disabled = true
        TOMBOL.textContent = 'Coba lagi'
        TOMBOL.disabled = false
        TOMBOL.onclick = () => location.reload()
      }

      async function bukaAplikasi() {
        try {
          // Cache-buster supaya CDN GitHub Pages tidak menyajikan url.json lama.
          const r = await fetch('url.json?ts=' + Date.now(), { cache: 'no-store' })
          if (!r.ok) throw new Error('url.json HTTP ' + r.status)
          const data = await r.json()
          if (!data.url || !/^https?:\/\//.test(data.url)) {
            tampilkanGalat(
              'Alamat aplikasi belum tercatat. Kalau Anda pengelolanya, pastikan PC ' +
                'server menyala dan skrip terowongan aktif.',
            )
            return
          }

          // Cek apakah backend hidup: coba /api/health dulu (opsional cepat).
          TEKS.textContent = 'Menghubungkan ke server'
          try {
            const h = await fetch(data.url + '/api/health', {
              cache: 'no-store',
              signal: AbortSignal.timeout(6000),
            })
            if (!h.ok) throw new Error('health HTTP ' + h.status)
          } catch (e) {
            // Tetap redirect walau health gagal (mungkin CORS): aplikasi utamanya di URL akar.
            console.warn('health check gagal, tetap meneruskan:', e)
          }

          TEKS.textContent = 'Meneruskan'
          location.replace(data.url + '/')
        } catch (e) {
          console.error(e)
          tampilkanGalat(
            'Belum bisa membaca alamat aplikasi. Coba muat ulang halaman ini beberapa saat lagi.',
          )
        }
      }

      bukaAplikasi()
    </script>
  </body>
</html>
