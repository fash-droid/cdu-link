<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keandalan Kilang | Pertamina</title>
    <meta
      name="description"
      content="Analisis keandalan dan pemeliharaan kilang Pertamina"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Google+Sans+Text:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --biru: #1a73e8;
        --biru-muda: #e8f0fe;
        --teks: #202124;
        --teks-2: #5f6368;
        --garis: #dadce0;
        --merah: #d93025;
        --merah-muda: #fce8e6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f8f9fa;
        color: var(--teks);
        font-family: 'Google Sans Text', 'Google Sans', Roboto, system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      main {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border: 1px solid var(--garis);
        border-radius: 12px;
        padding: 32px 28px;
        text-align: center;
      }
      .logo {
        width: 40px;
        height: 40px;
        margin: 0 auto 14px;
      }
      h1 {
        margin: 0 0 4px;
        font-family: 'Google Sans', 'Google Sans Text', Roboto, sans-serif;
        font-size: 22px;
        font-weight: 400;
      }
      .sub {
        margin: 0 0 22px;
        font-size: 13px;
        color: var(--teks-2);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--biru-muda);
        color: #1967d2;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 16px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        animation: kedip 1.2s infinite;
      }
      @keyframes kedip {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      p.pesan {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.55;
        color: var(--teks-2);
      }
      button {
        padding: 9px 22px;
        border-radius: 999px;
        border: 0;
        background: var(--biru);
        color: #fff;
        font: inherit;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #1765cc;
      }
      button[hidden] {
        display: none;
      }
      .kecil {
        margin: 18px 0 0;
        font-size: 12px;
        color: #80868b;
      }
      .galat {
        background: var(--merah-muda);
        color: var(--merah);
      }
      .galat .dot {
        animation: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M4 17.5 12.4 4l3.1 5.1-8.4 13.4H4z" fill="#1a73e8" />
        <path d="M10.6 22.5 19 9l3.1 5.1-8.4 8.4h-3.1z" fill="#1e8e3e" />
        <path d="M17.8 22.5 22.6 17l1.4 2.3-3.1 3.2h-3.1z" fill="#d93025" />
      </svg>
      <h1>Reliability &amp; Maintenance</h1>
      <p class="sub">Analisis keandalan dan pemeliharaan kilang Pertamina</p>
      <div id="status" class="status" role="status">
        <span class="dot"></span>
        <span id="status-teks">Membuka web</span>
      </div>
      <p id="pesan" class="pesan">Sedang meneruskan ke web. Siapkan kode akses dari Divisi R&amp;M.</p>
      <button id="tombol" hidden>Buka web</button>
      <p class="kecil">
        Alamat web kini tetap: <a id="tautan" href="https://keandalan.verifikasirbd.com">keandalan.verifikasirbd.com</a>.
        Simpan alamat itu sebagai bookmark.
      </p>
    </main>
    <script>
      // Sejak 9 November 2026 web berjalan di situs Cloudflare Pages dengan alamat tetap
      // (SITUS) yang hidup tanpa bergantung laptop server; halaman data selalu terbuka,
      // sedangkan Iterasi dan Asisten menunggu server laptop. Karena itu halaman ini tidak
      // lagi menunggu /api/health: cukup memastikan situs terjangkau, lalu meneruskan.
      // url.json tetap dibaca lebih dulu supaya alamat dapat diganti tanpa mengubah halaman ini.
      const SITUS = 'https://keandalan.verifikasirbd.com'
      const SITUS_CADANGAN = 'https://keandalan-kilang.pages.dev'
      const SUMBER = [
        'url.json',
        'https://raw.githubusercontent.com/fash-droid/cdu-link/main/url.json',
      ]
      const JEDA_MS = 4000
      const BATAS_COBA = 5 // sekitar dua puluh detik, lalu tombol buka langsung

      const STATUS = document.getElementById('status')
      const TEKS = document.getElementById('status-teks')
      const PESAN = document.getElementById('pesan')
      const TOMBOL = document.getElementById('tombol')

      function batasWaktu(ms) {
        if (window.AbortSignal && AbortSignal.timeout) return AbortSignal.timeout(ms)
        const c = new AbortController()
        setTimeout(() => c.abort(), ms)
        return c.signal
      }

      async function daftarAlamat() {
        const keluar = []
        for (const s of SUMBER) {
          try {
            const r = await fetch(s + '?ts=' + Date.now(), {
              cache: 'no-store',
              signal: batasWaktu(6000),
            })
            if (!r.ok) continue
            const d = await r.json()
            if (d && /^https:\/\//.test(d.url || '') && !keluar.includes(d.url)) keluar.push(d.url)
          } catch (e) {
            console.warn('gagal membaca', s, e)
          }
        }
        if (!keluar.includes(SITUS)) keluar.push(SITUS)
        // Alamat bawaan Pages: cadangan bila resolver jaringan belum mengenal nama domain kustom.
        if (!keluar.includes(SITUS_CADANGAN)) keluar.push(SITUS_CADANGAN)
        return keluar
      }

      async function terjangkau(url) {
        // Situs lintas asal: permintaan no-cors cukup untuk tahu alamatnya hidup,
        // tanpa membaca isinya dan tanpa bergantung pada server laptop.
        try {
          await fetch(url + '/', { mode: 'no-cors', cache: 'no-store', signal: batasWaktu(8000) })
          return true
        } catch (e) {
          return false
        }
      }

      function tampilkanGalat(tujuan) {
        STATUS.classList.add('galat')
        TEKS.textContent = 'Web belum dapat dihubungi dari jaringan Anda'
        PESAN.textContent =
          'Periksa sambungan internet, lalu tekan tombol di bawah untuk membuka web secara langsung.'
        TOMBOL.hidden = false
        TOMBOL.onclick = () => location.replace(tujuan + '/')
      }

      async function coba(ke) {
        STATUS.classList.remove('galat')
        TOMBOL.hidden = true
        TEKS.textContent = ke === 1 ? 'Membuka web' : 'Mencoba lagi'
        const alamat = await daftarAlamat()
        document.getElementById('tautan').href = alamat[0] || SITUS
        for (const url of alamat) {
          if (await terjangkau(url)) {
            TEKS.textContent = 'Meneruskan'
            PESAN.textContent = 'Web ditemukan. Masukkan kode akses pada halaman berikutnya.'
            location.replace(url + '/')
            return
          }
        }
        if (ke >= BATAS_COBA) {
          tampilkanGalat(alamat[0] || SITUS)
          return
        }
        PESAN.textContent = 'Web belum terjangkau, mencoba lagi dalam beberapa detik.'
        setTimeout(() => coba(ke + 1), JEDA_MS)
      }

      coba(1)
    </script>
  </body>
</html>
